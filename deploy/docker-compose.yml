services:
  web:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_EMAILJS_SERVICE_ID: ${NEXT_PUBLIC_EMAILJS_SERVICE_ID:-}
        NEXT_PUBLIC_EMAILJS_TEMPLATE_ID: ${NEXT_PUBLIC_EMAILJS_TEMPLATE_ID:-}
        NEXT_PUBLIC_EMAILJS_PUBLIC_KEY: ${NEXT_PUBLIC_EMAILJS_PUBLIC_KEY:-}
        NEXT_PUBLIC_CHAT_API_URL: https://${DOMAIN}
    restart: unless-stopped
    expose:
      - "3000"

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file:
      - ../backend/.env
    environment:
      ALLOWED_ORIGINS: https://${DOMAIN}
    restart: unless-stopped
    expose:
      - "8003"

  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    environment:
      DOMAIN: ${DOMAIN}
      WEB_HOST: web
      API_HOST: api
    depends_on:
      - web
      - api
    restart: unless-stopped

networks:
  default:
    name: basira-net
